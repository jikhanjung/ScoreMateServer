{% extends 'web/base.html' %}
{% block title %}가입{% endblock %}
{% block content %}
<div class="narrow">
  <h1>가입</h1>
  <div class="box">
    <form method="post" class="stack">{% csrf_token %}
      {% include 'web/_form_errors.html' %}
      {% for field in form %}{% include 'web/_field.html' %}{% endfor %}
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn primary" type="submit">가입</button>
    </form>
  </div>
  <p class="muted small" style="margin-top:1rem">이미 계정이 있으면 <a href="{% url 'web:login' %}{% if next %}?next={{ next|urlencode }}{% endif %}">로그인</a></p>
</div>
{% endblock %}
