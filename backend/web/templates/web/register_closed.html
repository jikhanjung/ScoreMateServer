{% extends 'web/base.html' %}
{% block title %}가입{% endblock %}
{% block content %}
<div class="narrow">
  <h1>초대받은 분만 가입할 수 있습니다</h1>
  <div class="box">
    <p>ScoreMate 는 앙상블 안에서 악보를 나누는 곳이라, 앙상블의 소유자나 리더가 보낸 <strong>초대 링크</strong>로 가입합니다.</p>
    <p class="muted small">링크를 받았다면 그 링크를 여세요. 초대 코드만 있다면 <a href="{% url 'web:join_form' %}">코드 입력</a> 뒤 로그인 화면의 "가입"으로.</p>
  </div>
  <p class="muted small" style="margin-top:1rem">이미 계정이 있으면 <a href="{% url 'web:login' %}">로그인</a></p>
</div>
{% endblock %}
