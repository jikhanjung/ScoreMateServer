# scoremate.noematica.kr — dolfinid 호스트 nginx 사이트 (/etc/nginx/sites-available/scoremate)
# 컨테이너는 127.0.0.1:8016. 받기는 Django 가 서명 토큰만 확인하고 X-Accel-Redirect 로 넘기면
# 아래 internal location 이 /srv/scoremate/files 에서 직접 보낸다(파일이 gunicorn 을 지나지 않는다).
#
# 적용(최초 1회, deploy/README.md):
#   1) 인증서 전: 아래 80 블록만 두고 reload → certbot certonly --webroot -w /srv/scoremate/acme -d scoremate.noematica.kr
#   2) 이 파일 전체로 교체 → sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name scoremate.noematica.kr;
    location ^~ /.well-known/acme-challenge/ {
        root /srv/scoremate/acme;
    }
    location / {
        return 301 https://scoremate.noematica.kr$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name scoremate.noematica.kr;
    ssl_certificate /etc/letsencrypt/live/scoremate.noematica.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scoremate.noematica.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    charset utf-8;
    # 악보 PDF 업로드 — MAX_UPLOAD_MB(기본 100) 보다 조금 크게. 기본값 1M 이면 조용히 413 이 난다
    client_max_body_size 110m;

    # 컨테이너 교체 중(down~up) 502 → 점검 페이지(503 유지)
    error_page 502 503 504 =503 /maintenance.html;
    location = /maintenance.html {
        root /srv/scoremate/maintenance;
        internal;
        add_header Retry-After 10 always;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Django 가 서명 토큰을 확인한 뒤에만 닿는다 (직접 요청은 404)
    location /_protected/ {
        internal;
        alias /srv/scoremate/files/;
        # Django 가 준 Content-Type · Content-Disposition · Cache-Control 을 그대로 쓴다
    }

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_intercept_errors on;
        proxy_pass http://127.0.0.1:8016;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
